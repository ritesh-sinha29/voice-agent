services:
  fastapi-voice-agent:
    build:
      context: .
      dockerfile: deploy/Dockerfile.agent
    container_name: fastapi-voice-agent
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"  # [M5] Bind to localhost only
    env_file:
      - .env
    environment:
      - AGENT_PORT=8000
      - DEEPGRAM_API_KEY=${DEEPGRAM_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - RUMIK_API_KEY=${RUMIK_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - VOBIZ_AUTH_ID=${VOBIZ_AUTH_ID}
      - VOBIZ_AUTH_TOKEN=${VOBIZ_AUTH_TOKEN}
      - VOBIZ_NUMBER=${VOBIZ_NUMBER}
    networks:
      - replora-voice-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 5s
      timeout: 5s
      retries: 5

  rumik-voice-studio:
    image: node:20-alpine
    container_name: rumik-voice-studio
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"  # [M5] Bind to localhost only
    env_file:
      - .env
    volumes:
      - ./dashboard:/app
    working_dir: /app
    command: sh -c "pnpm install && pnpm start"
    depends_on:
      fastapi-voice-agent:
        condition: service_started
    networks:
      - replora-voice-network

networks:
  replora-voice-network:
    name: replora-voice-network
